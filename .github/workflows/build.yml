name: Test and release

# Every push to main: test the gateway, build OpenMessage at the commit
# pinned in UPSTREAM plus the gateway, and publish them as the "latest"
# release that deploy/setup.sh downloads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Shell scripts parse
        run: bash -n deploy/setup.sh && bash -n deploy/textbridge && bash -n deploy/gcp-create.sh

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build OpenMessage at the pinned commit
        run: |
          set -euo pipefail
          commit="$(tr -d '[:space:]' < UPSTREAM)"
          git clone --quiet https://github.com/MaxGhenis/openmessage.git upstream
          git -C upstream checkout --quiet "$commit"
          # OpenMessage builds against a fork of mautrix-gmessages' libgm.
          # Check out the exact fork commit it pins and apply our patches
          # (e.g. the Gaia pairing confirmation Google now requires).
          gm_ref="$(sed -n 's#^replace go.mau.fi/mautrix-gmessages => github.com/MaxGhenis/gmessages .*-\([0-9a-f]\{12\}\)$#\1#p' upstream/go.mod)"
          test -n "$gm_ref"
          git clone --quiet https://github.com/MaxGhenis/gmessages.git gm
          git -C gm checkout --quiet "$gm_ref"
          for p in patches/gmessages/*.patch; do git -C gm apply "$PWD/$p"; done
          grep -q PrivateAPIConfirmation gm/pkg/libgm/pair_google.go
          (cd gm && go vet ./pkg/libgm/...)
          (cd upstream && go mod edit -replace "go.mau.fi/mautrix-gmessages=../gm")
          cd upstream
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=textbridge-${commit:0:7}" -o ../dist/openmessage .
      - name: Build gateway
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/textbridge-gateway ./cmd/textbridge-gateway
      - name: Package
        run: |
          set -euo pipefail
          cd dist
          tar -czf ../textbridge-linux-amd64.tar.gz openmessage textbridge-gateway
          cd ..
          sha256sum textbridge-linux-amd64.tar.gz > textbridge-linux-amd64.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          gh release create "$tag" textbridge-linux-amd64.tar.gz textbridge-linux-amd64.tar.gz.sha256 \
            --title "$tag" --notes "OpenMessage $(cat UPSTREAM | cut -c1-7) + gateway ${GITHUB_SHA::7}" --latest
